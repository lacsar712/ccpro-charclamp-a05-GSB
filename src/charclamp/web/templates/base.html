<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}CharClamp{% endblock %} · 炭窑焖烧志</title>
  <link rel="stylesheet" href="/static/css/theme.css" />
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand-block">
        <span class="ember"></span>
        <div>
          <strong>CharClamp</strong>
          <small>{% block site_label %}乌石岗焖烧坞{% endblock %}</small>
        </div>
      </div>
      <nav class="topnav" aria-label="主导航">
        <a href="/" class="topnav-link">时间轴</a>
        <a href="/certificates" class="topnav-link">容积证</a>
      </nav>
      <div class="topbar-actions">
        {% block top_actions %}{% endblock %}
        {% if user %}
        <a class="link-quiet" href="/logout">退出 {{ user.username }}</a>
        {% endif %}
      </div>
    </header>

    {% if flash %}
    <div class="flash flash-{{ flash_cat or 'ok' }}" id="flash">{{ flash }}</div>
    {% endif %}

    <div class="stage">
      {% block content %}{% endblock %}
    </div>
  </div>

  <div id="drawer-root" class="drawer-root" aria-live="polite"></div>
  <div
    id="drawer-backdrop"
    class="drawer-backdrop"
    hx-on:click="closeDrawer()"
  ></div>
  <script>
    document.body.addEventListener('htmx:afterSwap', function (evt) {
      if (evt.detail.target && evt.detail.target.id === 'drawer-root') {
        document.getElementById('drawer-backdrop').classList.add('open');
        document.getElementById('drawer-root').classList.add('open');
        initShiftCertHint();
      }
    });
    function initShiftCertHint() {
      var sel = document.getElementById('shift-clamp-select');
      if (!sel) { return; }
      var hint = document.getElementById('shift-cert-hint');
      var peak = document.getElementById('shift-peak-input');
      var btn = document.getElementById('shift-submit-btn');
      function refresh() {
        var opt = sel.options[sel.selectedIndex];
        if (!opt) { return; }
        if (opt.dataset.hasCert === '1') {
          hint.className = 'hint';
          hint.textContent = '现行证温度上限 ' + opt.dataset.tempLimit + '℃，峰值可留空，填写则不得超过该上限。';
          if (peak) { peak.max = opt.dataset.tempLimit; }
          btn.disabled = false;
        } else {
          hint.className = 'hint warn';
          hint.textContent = '该炭窑尚无现行窑膛容积证，请先到「容积证」页办证；无证不能登记班次。';
          if (peak) { peak.removeAttribute('max'); }
          btn.disabled = true;
        }
      }
      sel.addEventListener('change', refresh);
      refresh();
    }
    function closeDrawer() {
      document.getElementById('drawer-root').innerHTML = '';
      document.getElementById('drawer-root').classList.remove('open');
      document.getElementById('drawer-backdrop').classList.remove('open');
    }
  </script>
</body>
</html>
